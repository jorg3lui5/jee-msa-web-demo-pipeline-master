apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: jee-msa-web-demo-pipeline
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: jee-msa-web-demo-pipeline
spec:
  source:
    type: Git
    git:
      uri: https://github.com/jorg3lui5/jee-msa-web-demo-pipeline-master.git
  strategy:
    type: Docker
  output:
    to:
      kind: ImageStreamTag
      name: jee-msa-web-demo-pipeline:latest
